# Compila el APK de Android (arm64) del fork mixxx-scratch-android.
#
# - Cada push a la rama `scratch` y cada ejecución manual dejan el APK como
#   artifact del run (Actions → el run → Artifacts).
# - Un tag `vX.Y.Z-android` además crea una release de GitHub con el APK, que es
#   lo que lee el actualizador de la app (src/qml/qmlappupdateproxy.cpp).
#
# Firma: si existen los secrets ANDROID_SIGNING_KEYSTORE_BASE64 y
# ANDROID_SIGNING_PASSWORD se usa ese keystore (alias "mixxx"). Si no, se genera
# uno temporal: el APK instala, pero cada build queda firmado distinto y no se
# puede actualizar una sobre otra sin desinstalar.

name: Android APK

on:
  push:
    branches: [scratch]
    tags: ["v*-android"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
      BUILDENV_BASEPATH: /home/runner/buildenv
      BUILDENV_RELEASE: TRUE
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf /home/packer /opt/az /opt/google /opt/microsoft /opt/pipx \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/node /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Python /usr/lib/google-cloud-sdk \
            /usr/local/julia* /usr/local/share/powershell /usr/share/dotnet \
            /usr/share/swift /usr/local/share/vcpkg
          df -h /

      - name: Mirror the stem separation models
        # Spleeter 4stems (Deezer, MIT; ONNX by Best-Practice from the
        # sherpa-onnx port, Apache-2.0) and HTDemucs (Meta, MIT; ONNX by
        # StemSplitio, MIT) from Hugging Face to this repo's release, so the
        # app downloads them from here. The sizes and SHA-256 must match
        # src/stems/stemmodels.cpp.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          if gh release view stems-models-v1 --json assets --jq '.assets[].name' 2>/dev/null | grep -q htdemucs-fp16weights.onnx; then
            echo "Models already mirrored"
            exit 0
          fi
          mkdir -p /tmp/models && cd /tmp/models
          HF=https://huggingface.co/Best-Practice
          for s in drums bass other vocals; do
            curl -fsSL -o "spleeter-$s.fp16.onnx" "$HF/spleeter-4stems-onnx/resolve/main/$s.fp16.onnx"
          done
          curl -fsSL -o htdemucs-fp16weights.onnx "$HF/htdemucs-onnx/resolve/main/htdemucs_fp16weights.onnx"
          ok=1
          for f in *.onnx; do
            sum=$(sha256sum "$f" | cut -d' ' -f1); size=$(stat -c %s "$f")
            echo "$f $size $sum"
            if ! grep -q "$sum" "$GITHUB_WORKSPACE/src/stems/stemmodels.cpp"; then
              echo "::error title=Stem model hash::$f size=$size sha256=$sum is not in stemmodels.cpp"
              ok=0
            fi
          done
          [ "$ok" = 1 ] || exit 1
          gh release view stems-models-v1 >/dev/null 2>&1 || \
            gh release create stems-models-v1 --target "${{ github.sha }}" \
              --title "Stem separation models" \
              --notes "Spleeter 4stems (Deezer, MIT) and HTDemucs (Meta, MIT) in ONNX, mirrored from huggingface.co/Best-Practice. Downloaded by the app on demand."
          gh release upload stems-models-v1 *.onnx --clobber -R "${{ github.repository }}"
          cd / && rm -rf /tmp/models

      - name: Set up signing key
        run: |
          if [ -z "${ANDROID_SIGNING_KEYSTORE_BASE64}" ]; then
            echo "::warning::Sin keystore en los secrets: se firma con una clave temporal."
            PASS=mixxxandroid
            keytool -genkey -keystore "$GITHUB_WORKSPACE/mixxx.keystore" -alias mixxx \
              -keyalg RSA -keysize 2048 -validity 365 \
              -keypass "$PASS" -storepass "$PASS" -dname "CN=${{ github.actor }}"
          else
            echo "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 -d > "$GITHUB_WORKSPACE/mixxx.keystore"
            PASS="${ANDROID_SIGNING_PASSWORD}"
          fi
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=${PASS}"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=${PASS}"
            echo "QT_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/mixxx.keystore"
          } >> "$GITHUB_ENV"

      - name: Set up build environment
        run: tools/android_buildenv.sh setup

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: android-ccache-${{ github.ref_name }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            android-ccache-${{ github.ref_name }}-
            android-ccache-

      - name: Set up ccache
        run: |
          ccache --zero-stats
          ccache --max-size=2G

      - name: Fetch ONNX Runtime (stem separation)
        # CMake downloads it too, but without retries; Maven Central fails now
        # and then. Pre-extracting it makes CMake skip the download.
        run: |
          set -e
          VERSION=$(grep -oP 'MIXXX_ONNXRUNTIME_VERSION \K[0-9.]+' cmake/modules/MixxxAndroid.cmake)
          mkdir -p build/onnxruntime
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o /tmp/ort.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/$VERSION/onnxruntime-android-$VERSION.aar"
          unzip -q -o /tmp/ort.aar 'headers/*' 'jni/arm64-v8a/libonnxruntime.so' -d build/onnxruntime
          ls build/onnxruntime/headers | head

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          env | grep -E '^(ANDROID|JAVA_HOME|BUILDENV|MIXXX_VCPKG|VCPKG)' | sort
          if ! cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_SYSTEM_NAME=Android \
            -DVCPKG_TARGET_TRIPLET=arm64-android-release \
            -DVCPKG_DEFAULT_HOST_TRIPLET=x64-linux-release \
            -DQT6=ON -DQML=ON -DHID=ON -DBULK=ON \
            -DVINYLCONTROL=ON \
            -DSTEM=ON \
            -DKEYFINDER=ON \
            -DBUILD_TESTING=OFF -DBUILD_BENCH=OFF \
            -DWARNINGS_FATAL=OFF \
            -DDEBUG_ASSERTIONS_FATAL=OFF 2>&1 | tee configure.log; then
            # Los errores como anotaciones, para leerlos sin bajar el log
            grep -n -A4 -E 'CMake Error|error:|Error:|FATAL' configure.log | head -c 3500 \
              | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=Configure::/'
            { grep -E 'BUILDENV|Downloading|SHA256|Unpacking' configure.log; ls -la /home/runner/buildenv; ls /home/runner/buildenv/*/ /home/runner/buildenv/*/installed 2>&1; } | head -c 3000 \
              | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=Buildenv::/'
            tail -n 25 configure.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=Configure tail::/'
            exit 1
          fi

      - name: Compile translations
        run: |
          LRELEASE=$(find /home/runner/buildenv -path '*x64-linux-release/tools/Qt6/bin/lrelease' | head -n 1)
          [ -n "$LRELEASE" ] || { echo "::error::lrelease not found in the buildenv"; exit 1; }
          for ts in res/translations/mixxx-android_*.ts; do
            "$LRELEASE" -silent "$ts" -qm "${ts%.ts}.qm"
          done

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --target apk --parallel "$(nproc)" 2>&1 | tee build.log; then
            grep -n -B2 -A6 -E "error:|Error [0-9]|FAILED" build.log | head -c 3500 \
              | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=Build::/'
            exit 1
          fi

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: android-ccache-${{ github.ref_name }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}

      - name: Collect APK
        id: apk
        run: |
          APK=$(find build/android-build/build/outputs/apk/release -name '*.apk' | grep -v unsigned | head -n 1)
          [ -n "$APK" ] || APK=$(find build/android-build/build/outputs/apk/release -name '*.apk' | head -n 1)
          VERSION=$(grep -oP 'android:versionName="\K[^"]+' packaging/android/AndroidManifest.xml)
          mkdir -p out
          cp "$APK" "out/mixxx-android-v${VERSION}.apk"
          echo "file=out/mixxx-android-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-android-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        if: github.ref == 'refs/heads/scratch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'android:versionName="\K[^"]+' packaging/android/AndroidManifest.xml)
          TAG="v${VERSION}-android"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.file }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" --target "${{ github.sha }}" \
              --title "Mixxx Scratch Android ${VERSION}" \
              --notes "Build automática de ${{ github.sha }} (rama ${{ github.ref_name }})."
          fi
